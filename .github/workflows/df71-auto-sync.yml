name: DF71 Auto-Sync & Fleet Update

on:
  schedule:
    - cron: '0 3 * * *' # Nightly at 03:00 UTC
  repository_dispatch:
    types: [df71-release]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-sync:
    name: Sync Dark Factory Processes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Pull Environment
        run: make env || true

      - name: Install Dependencies
        run: make setup || pnpm install

      - name: Update DF71 Package
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm add -D df71@latest || true
          elif [ -f package-lock.json ]; then
            npm install --save-dev df71@latest || true
          fi

      - name: Run DF71 Process Sync
        run: npx --yes df71@latest sync --fix

      - name: Verify Dark Factory Gate
        id: gate_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make df71:check || npx --yes df71@latest check --create-issue

      - name: Check for Process Drift
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request on Changes
        if: steps.git_status.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(df71): sync dark factory processes and rules to latest release"
          title: "chore(df71): update dark factory processes, rules and skills"
          body: |
            Automated synchronization from upstream `df71` release.
            All mechanical gates, tests, and line budgets verified green.
          branch: "df71/auto-sync"
          delete-branch: true
